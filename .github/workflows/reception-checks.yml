name: Reception ledger checks
on:
  push:
    branches: [welcome-house-reception-ledgers]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reception:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure reception, cast and interior rules
        run: |
          node --check reception.js
          node --check journey.js
          node --check story-mode.js
          node tests/reception.cjs
          node tests/reception-edits.cjs
          node tests/community.cjs
          node tests/interiors.cjs
          node tests/working-careers.cjs
          node tests/stock-careers.cjs
          node tests/job-coaching.cjs
          node tests/neighbours.cjs
          node tests/career-manual.cjs
          node tests/room-photo-audit.cjs
      - name: Install pinned browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Real browser reception and preservation checks
        env:
          TEST_URL: http://127.0.0.1:8794/
        run: |
          python3 -m http.server 8794 >/tmp/honeybrook-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8794/ >/dev/null && break
            sleep 1
          done
          node tests/reception.mjs
          node tests/reception-edits.mjs
          node tests/page-back.mjs
          node tests/quiet-guest-rooms.mjs
          node tests/interior-navigation.mjs
          node tests/welcome-office.mjs
          node tests/job-coaching.mjs
          node tests/neighbours.mjs
          node tests/neighbour-placement.mjs
          node tests/fair-coaching.mjs
          node tests/town-job-coaching.mjs
          node tests/office-printing.mjs
          node tests/sound-layout.mjs
          node tests/room-photos.mjs
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reception-browser-evidence
          path: verification/
          if-no-files-found: ignore
          compression-level: 0
