name: Film school preservation checks
on:
  pull_request:
    paths: ['film-*.js', 'film-school.html', 'film-school.css', 'assets/film-school/**', 'tests/film-*', 'learning.html', 'interiors.js', '.github/workflows/film-school-checks.yml']
  push:
    branches: [main, codex/film-studies-opening]
    paths: ['film-*.js', 'film-school.html', 'film-school.css', 'assets/film-school/**', 'tests/film-*', 'learning.html', 'interiors.js', '.github/workflows/film-school-checks.yml']
permissions:
  contents: read
jobs:
  browser-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/film-tools" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/film-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Rule and data regressions
        run: |
          for file in tests/*.cjs; do node "$file" || exit 1; done
      - name: School and current world browser checks
        run: |
          python3 -m http.server 8792 --bind 127.0.0.1 > "$RUNNER_TEMP/film-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export TEST_URL=http://127.0.0.1:8792
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/film-tools/node_modules/playwright/index.mjs"
          export HONEYBROOK_PLAYWRIGHT_MODULE="$PLAYWRIGHT_MODULE"
          node tests/film-foundation.mjs
          node tests/film-campus.mjs
          node tests/film-world.mjs
          export PLAYWRIGHT_MODULE="$PWD/tests/player-browser.mjs"
          node tests/opening-back.mjs
          node tests/page-back.mjs
          node tests/refresh-entrance.mjs
